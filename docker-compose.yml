services:

  frontend:
    build: ./frontend/
    container_name: frontend
    env_file: ".env"
    ports:
      - 80:80
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - test

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    env_file: ".env"
    ports:
      - 3030:3030
    restart: unless-stopped
    depends_on:
      db_auth:
        condition: service_healthy
    networks:
      - test

  products-service:
    build: ./backend/products-service
    container_name: products-service
    env_file: ".env"
    ports:
      - 3020:3020
    restart: unless-stopped
    depends_on:
      db_auth:
        condition: service_healthy
    networks:
      - test

  scraper-service:
    build: ./backend/scraper-service
    container_name: scraper-service
    env_file: ".env"
    ports:
      - 3040:3040
    restart: unless-stopped
    # depends_on:
    #   db_auth:
    #     condition: service_healthy
    networks:
      - test


  trasformer-service:
    build: ./backend/trasformer-service
    container_name: trasformer-service
    env_file: ".env"
    ports:
      - 3050:3050
    restart: unless-stopped
    # depends_on:
    #   db_auth:
    #     condition: service_healthy
    networks:
      - test

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - test

  db_auth:
    image: postgres:17-alpine3.22
    container_name: db_auth
    restart: always
    env_file: ".env" 
    environment:
      - POSTGRES_USER=${POSTGRES_USER_AUTH}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_AUTH}
      - POSTGRES_DB=${POSTGRES_DB_AUTH}
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./backend/auth-service/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s   
    networks:
      - test

  db_products:
    image: postgres:17-alpine3.22
    container_name: db_products
    restart: always
    env_file: ".env"
    environment:
      - POSTGRES_USER=${POSTGRES_USER_PRODUCTS}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_PRODUCTS}
      - POSTGRES_DB=${POSTGRES_DB_PRODUCTS}
    ports:
      - "5432:5432"
    volumes:
      - postgres_products_data:/var/lib/postgresql/data
      - ./backend/products-service/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - test

volumes:
  postgres_auth_data:
  postgres_products_data:
  mongo_data:

networks:
  test:
    driver: bridge